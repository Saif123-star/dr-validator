[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-reviewer"
version = "0.2.0"
description = "Design-requirement review workflow with human-approved Confluence review-page publication"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
dr-review = "dr_reviewer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
